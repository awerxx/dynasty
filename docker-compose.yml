services:
  linda-api:
    build:
      context: .
      dockerfile: src/Linda/Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
    ports:
      - "5036:8080"

  blake-web:
    build:
      context: .
      dockerfile: src/Blake/Web/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - TZ=Europe/Warsaw
    ports:
      - "5255:8080"

  alexis-ui:
    build:
      context: .
      dockerfile: src/Dynasty.Carrington.Alexis/Dockerfile
    environment:
      - NODE_ENV=production
    ports:
      - "3000:3000"
